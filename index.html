<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wander.ventures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Archivo Black', sans-serif;
        }

        #video-container {
            --video-x: 50%;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #myVideo,
        #jumpVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: var(--video-x) bottom;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 2s ease-in-out;
        }

        @media (orientation: portrait) {
            #video-container {
                --video-x: 100%;
            }
        }

        #myVideo {
            z-index: 1;
            opacity: 1;
        }

        #jumpVideo {
            z-index: 2;
            opacity: 0;
        }

        #motion-hint {
            position: absolute;
            left: 50%;
            top: 66%;
            z-index: 10;
            display: none;
            width: 88px;
            height: 118px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #motion-hint svg {
            width: 100%;
            height: 100%;
            display: block;
            animation: phone-tilt 3.6s ease-in-out infinite;
            transform-origin: 50% 50%;
        }

        @keyframes phone-tilt {
            0%,
            100% {
                transform: rotate(0deg);
            }

            33% {
                transform: rotate(-13deg);
            }

            66% {
                transform: rotate(13deg);
            }
        }

        #outro-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 11;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #fff;
            background: transparent;
            opacity: 1;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
        }

        #title-screen {
            color: #fff;
            font-weight: normal;
            font-size: 120px;
            line-height: 0.8;
            margin-bottom: 15px;
            max-width: 90%;
            text-align: center;
        }

        #title-screen div {
            opacity: 0;
            visibility: hidden;
        }

        #title-screen div:last-child {
            transform: translateX(-0.18em);
        }

        #button-slot {
            display: grid;
            place-items: center;
            min-height: 96px;
        }

        #button-slot > * {
            grid-area: 1 / 1;
        }

        #play-button {
            width: 96px;
            height: 96px;
            cursor: pointer;
            z-index: 12;
            background: transparent;
            border: 0;
            padding: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: auto;
        }

        #play-button.corner {
            position: absolute;
            right: 24px;
            bottom: 24px;
            width: 68px;
            height: 68px;
        }

        #play-button svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        #play-button .mute-slash-cutout {
            display: block;
        }

        #play-button.sound-on-icon .mute-slash-cutout {
            display: none;
        }

        #jump-button,
        #hire-button {
            cursor: pointer;
            padding: 15px 40px;
            background-color: skyblue;
            color: #fff;
            font-size: 2vw;
            font-weight: normal;
            border-radius: 50px;
            border: 0;
            white-space: nowrap;
            text-decoration: none;
            font-family: inherit;
            pointer-events: auto;
        }

        #jump-button {
            opacity: 0;
            visibility: hidden;
            transform: scale(1);
        }

        #outro-text {
            max-width: 700px;
            font-size: 20px;
            line-height: 1.4;
            margin-bottom: 20px;
            pointer-events: auto;
            text-align: left;
        }

        #outro-text p {
            margin: 0;
        }

        #outro-text p + p {
            margin-top: 1.4em;
        }

        #outro-text a {
            color: #fff;
        }

        #projects-backdrop {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            background: rgba(0, 0, 0, 0.55);
        }

        #projects-modal {
            position: absolute;
            inset: 150px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background: #fff;
            color: #000;
            border-radius: 32px;
            padding: 40px;
            box-sizing: border-box;
            overflow: auto;
        }

        #projects-title {
            font-size: 120px;
            line-height: 0.8;
            margin-bottom: 40px;
            text-align: left;
        }

        #project-list {
            display: flex;
            gap: 32px;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;
            width: 100%;
        }

        #project-list img {
            max-width: 220px;
            max-height: 160px;
            object-fit: contain;
            display: block;
        }

        @media (pointer: coarse) {
            #play-button {
                opacity: 1;
            }
        }

        @media (max-width: 1200px) {
            #title-screen,
            #projects-title {
                font-size: 10vw;
            }

            #jump-button,
            #hire-button {
                font-size: 5vw;
            }
        }

        @media (max-width: 700px) {
            #outro-overlay {
                width: calc(100vw - 20px);
            }

            #title-screen,
            #projects-title {
                font-size: 14vw;
                max-width: 100%;
            }

            #outro-text {
                width: 100%;
                max-width: none;
                padding: 0 18px;
                box-sizing: border-box;
            }

            #projects-modal {
                inset: 10px;
                border-radius: 22px;
                padding: 20px 10px;
            }
        }
    </style>
</head>

<body>

    <div id="video-container">
        <video id="myVideo" playsinline preload="auto" loop muted>
            <source src="chancho.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <video id="jumpVideo" playsinline preload="auto">
            <source src="jumpin.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div id="motion-hint">
            <svg viewBox="0 0 120 160" aria-hidden="true">
                <mask id="phone-cutout">
                    <rect width="120" height="160" fill="white" />
                    <rect x="24" y="22" width="72" height="104" rx="4" fill="black" />
                    <circle cx="60" cy="140" r="5" fill="black" />
                </mask>
                <rect x="14" y="4" width="92" height="152" rx="14" fill="#fff" mask="url(#phone-cutout)" />
            </svg>
        </div>

        <div id="outro-overlay">
            <div id="title-screen">
                <div>WANDER</div>
                <div>VENTURES</div>
            </div>

            <div id="button-slot">
                <button id="play-button" aria-label="Turn sound on">
                    <svg viewBox="0 0 120 120" aria-hidden="true">
                        <mask id="volume-cutout">
                            <rect width="120" height="120" fill="white" />
                            <g transform="translate(10 10)">
                                <path d="M25 40h14l20-18v56L39 60H25z" fill="black" />
                                <path d="M67 36q12 14 0 28" fill="none" stroke="black" stroke-width="8" stroke-linecap="square" />
                                <path d="M77 25q22 25 0 50" fill="none" stroke="black" stroke-width="8" stroke-linecap="square" />
                            </g>
                            <path class="mute-slash-cutout" d="M92 27L28 93" fill="none" stroke="black" stroke-width="14" stroke-linecap="butt" />
                        </mask>
                        <circle cx="60" cy="60" r="58" fill="#fff" mask="url(#volume-cutout)" />
                    </svg>
                </button>

                <button id="jump-button">JUMP IN</button>
            </div>
        </div>
    </div>

    <div id="projects-backdrop">
        <div id="projects-modal">
            <div id="projects-title">PROJECTS</div>
            <div id="project-list">
                <a href="https://colorlog.in">
                    <img src="/projects/color.png" alt="Color">
                </a>
                <a href="https://unfinished.productions">
                    <img src="/projects/unfinishedproductions.png" alt="Unfinished Productions">
                </a>
                <a href="https://itscalledthelobby.com">
                    <img src="/projects/lobby.png" alt="The Lobby">
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoContainer = document.getElementById('video-container');
            const myVideo = document.getElementById('myVideo');
            const jumpVideo = document.getElementById('jumpVideo');
            const playButton = document.getElementById('play-button');
            const outroOverlay = document.getElementById('outro-overlay');
            const jumpButton = document.getElementById('jump-button');
            const titleScreen = document.getElementById('title-screen');
            const wanderTitle = document.querySelector('#title-screen div:first-child');
            const venturesTitle = document.querySelector('#title-screen div:last-child');
            const projectsBackdrop = document.getElementById('projects-backdrop');
            const motionHint = document.getElementById('motion-hint');

            let buttonIsCorner = false;
            let buttonChangingIcon = false;
            let introStarted = false;
            let jumpStarted = false;
            let soundOn = false;
            let waveVolumeLevel = 0;
            let fadeInAudio;
            let fadeWaveAudio;
            let fadeInDelay;
            let hideButtonTimeout;
            let buttonMoveTimeout;
            let portraitPanFrame;
            let devicePanningReady = false;
            let deviceOrientationActive = false;
            let devicePermissionReady = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function';
            let portraitPanComplete = false;
            let neutralGamma = null;
            let smoothedDeviceX = 50;

            jumpVideo.volume = 0;
            myVideo.volume = 0;
            titleScreen.style.transition = 'opacity 1s ease-in-out';
            jumpButton.style.transition = 'transform 150ms ease';
            wanderTitle.style.transition = 'opacity 1s ease-in-out';
            venturesTitle.style.transition = 'opacity 1s ease-in-out';

            outroOverlay.style.display = 'flex';

            function isTouchMode() {
                return window.matchMedia('(pointer: coarse)').matches;
            }

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function smoothstep(value) {
                return value * value * (3 - 2 * value);
            }

            function setVideoX(value) {
                videoContainer.style.setProperty('--video-x', `${value}%`);
            }

            function isPortraitCropMode() {
                if (!window.matchMedia('(orientation: portrait)').matches || !myVideo.videoWidth || !myVideo.videoHeight) {
                    return false;
                }

                return myVideo.videoWidth / myVideo.videoHeight > videoContainer.clientWidth / videoContainer.clientHeight;
            }

            function showMotionHint() {
                if (isTouchMode() && isPortraitCropMode() && portraitPanComplete) {
                    motionHint.style.display = 'block';
                }
            }

            function hideMotionHint() {
                motionHint.style.display = 'none';
            }

            function handleDeviceOrientation(event) {
                if (!devicePanningReady || !isPortraitCropMode() || !Number.isFinite(event.gamma)) {
                    return;
                }

                if (neutralGamma === null) {
                    neutralGamma = event.gamma;
                }

                const twist = event.gamma - neutralGamma;
                const threshold = 10;
                const maxTwist = 34;
                const twistAmount = Math.abs(twist);

                if (twistAmount <= threshold) {
                    return;
                }

                hideMotionHint();

                const progress = clamp((twistAmount - threshold) / (maxTwist - threshold), 0, 1);
                const curvedTwist = smoothstep(progress) * progress;
                const targetX = clamp(50 + Math.sign(twist) * curvedTwist * 50, 0, 100);

                smoothedDeviceX += (targetX - smoothedDeviceX) * 0.06;
                setVideoX(smoothedDeviceX);
            }

            function enableDevicePanning() {
                if (!portraitPanComplete || !devicePermissionReady) {
                    return;
                }

                devicePanningReady = true;
                neutralGamma = null;
                smoothedDeviceX = 50;

                if (!deviceOrientationActive) {
                    deviceOrientationActive = true;
                    window.addEventListener('deviceorientation', handleDeviceOrientation);
                }
            }

            function requestDevicePanningPermission() {
                if (typeof DeviceOrientationEvent === 'undefined') {
                    return;
                }

                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permission => {
                            devicePermissionReady = permission === 'granted';
                            enableDevicePanning();
                        })
                        .catch(() => {});
                } else {
                    devicePermissionReady = true;
                    enableDevicePanning();
                }
            }

            function startPortraitPan() {
                cancelAnimationFrame(portraitPanFrame);
                hideMotionHint();
                portraitPanComplete = false;
                devicePanningReady = false;

                if (!isPortraitCropMode()) {
                    setVideoX(50);
                    return;
                }

                const startTime = performance.now();
                setVideoX(100);

                function animate(now) {
                    if (!isPortraitCropMode()) {
                        setVideoX(50);
                        return;
                    }

                    const elapsed = now - startTime;

                    if (elapsed <= 2000) {
                        setVideoX(100);
                        portraitPanFrame = requestAnimationFrame(animate);
                        return;
                    }

                    if (elapsed <= 12000) {
                        setVideoX(100 - 100 * smoothstep((elapsed - 2000) / 10000));
                        portraitPanFrame = requestAnimationFrame(animate);
                        return;
                    }

                    if (elapsed <= 23000) {
                        setVideoX(50 * smoothstep((elapsed - 12000) / 11000));
                        portraitPanFrame = requestAnimationFrame(animate);
                        return;
                    }

                    setVideoX(50);
                    portraitPanComplete = true;
                    showMotionHint();
                    enableDevicePanning();
                }

                portraitPanFrame = requestAnimationFrame(animate);
            }

            function getWaveLoopEnd() {
                if (jumpStarted) {
                    return Number.isFinite(myVideo.duration) && myVideo.duration > 0 ? Math.min(40, myVideo.duration) : 40;
                }

                return Number.isFinite(myVideo.duration) && myVideo.duration > 0 ? myVideo.duration : 40;
            }

            function getWaveLoopVolume() {
                const loopEnd = getWaveLoopEnd();
                const fadeSeconds = Math.min(2, loopEnd / 2);
                const currentTime = Math.min(myVideo.currentTime, loopEnd);
                const timeToEnd = loopEnd - currentTime;

                if (currentTime < fadeSeconds) {
                    return currentTime / fadeSeconds;
                }

                if (timeToEnd < fadeSeconds) {
                    return Math.max(0, timeToEnd / fadeSeconds);
                }

                return 1;
            }

            function applyWaveVolume() {
                const loopEnd = getWaveLoopEnd();

                if (jumpStarted && myVideo.currentTime >= loopEnd) {
                    myVideo.currentTime = 0;
                    myVideo.play().catch(error => {
                        console.error('Wave video failed:', error);
                    });
                }

                myVideo.volume = soundOn ? waveVolumeLevel * getWaveLoopVolume() : 0;
            }

            function fadeWaveVolume(targetVolume) {
                clearInterval(fadeWaveAudio);

                const startVolume = waveVolumeLevel;
                let step = 0;

                fadeWaveAudio = setInterval(() => {
                    step++;
                    waveVolumeLevel = startVolume + (targetVolume - startVolume) * (step / 20);
                    applyWaveVolume();

                    if (step >= 20) {
                        clearInterval(fadeWaveAudio);
                        waveVolumeLevel = targetVolume;
                        applyWaveVolume();
                    }
                }, 50);
            }

            function fadeVolume(video, targetVolume) {
                clearInterval(fadeInAudio);

                const startVolume = video.volume;
                let step = 0;

                fadeInAudio = setInterval(() => {
                    step++;
                    video.volume = startVolume + (targetVolume - startVolume) * (step / 20);

                    if (step >= 20) {
                        clearInterval(fadeInAudio);
                        video.volume = targetVolume;
                    }
                }, 50);
            }

            function setButtonOpacity(value) {
                playButton.style.opacity = String(isTouchMode() && playButton.style.display !== 'none' ? 1 : clamp(value, 0, 1));
            }

            function getButtonOpacity(event) {
                const rect = playButton.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const distance = Math.hypot(event.clientX - centerX, event.clientY - centerY);
                const radius = rect.width / 2;

                if (distance <= radius) {
                    return 1;
                }

                if (buttonIsCorner) {
                    return clamp(0.8 * (1 - (distance - radius) / 260), 0, 0.8);
                }

                const edgeDistance = Math.min(
                    event.clientX,
                    event.clientY,
                    window.innerWidth - event.clientX,
                    window.innerHeight - event.clientY
                );

                if (edgeDistance <= 100) {
                    return 0;
                }

                return clamp(((edgeDistance - 100) / Math.max(1, Math.min(window.innerWidth, window.innerHeight) / 2 - 100)) * 0.8, 0, 0.8);
            }

            function scheduleButtonHide() {
                if (isTouchMode()) {
                    return;
                }

                clearTimeout(hideButtonTimeout);
                hideButtonTimeout = setTimeout(() => {
                    if (!playButton.matches(':hover')) {
                        setButtonOpacity(0);
                    }
                }, 5000);
            }

            function updateButtonFromPointer(event) {
                if (playButton.style.display === 'none' || buttonChangingIcon) {
                    return;
                }

                setButtonOpacity(getButtonOpacity(event));
                scheduleButtonHide();
            }

            function moveButtonToCorner() {
                clearTimeout(buttonMoveTimeout);
                buttonChangingIcon = true;
                setButtonOpacity(0);

                buttonMoveTimeout = setTimeout(() => {
                    if (!buttonIsCorner) {
                        videoContainer.appendChild(playButton);
                        playButton.classList.add('corner');
                        buttonIsCorner = true;
                    }

                    playButton.style.display = 'block';
                    playButton.classList.toggle('sound-on-icon', soundOn);
                    setButtonOpacity(isTouchMode() ? 1 : 0);
                    buttonChangingIcon = false;
                }, 1000);
            }

            function startIntroTimers() {
                if (introStarted) {
                    return;
                }

                introStarted = true;

                setTimeout(() => {
                    wanderTitle.style.visibility = 'visible';
                    wanderTitle.style.opacity = '1';
                }, 10000);

                setTimeout(() => {
                    venturesTitle.style.visibility = 'visible';
                    venturesTitle.style.opacity = '1';
                }, 14000);

                setTimeout(() => {
                    jumpButton.style.visibility = 'visible';
                    jumpButton.style.opacity = '1';

                    if (!buttonIsCorner) {
                        playButton.style.display = 'none';
                    }
                }, 22700);
            }

            document.addEventListener('mousemove', updateButtonFromPointer);

            document.addEventListener('click', event => {
                if (event.target.id === 'projects-link') {
                    event.preventDefault();
                    projectsBackdrop.style.display = 'block';
                }

                if (event.target === projectsBackdrop) {
                    projectsBackdrop.style.display = 'none';
                }
            });

            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    projectsBackdrop.style.display = 'none';
                }
            });

            window.addEventListener('resize', () => {
                if (!isPortraitCropMode()) {
                    cancelAnimationFrame(portraitPanFrame);
                    hideMotionHint();
                    setVideoX(50);
                }

                setButtonOpacity(isTouchMode() ? 1 : playButton.style.opacity);
            });

            myVideo.addEventListener('playing', () => {
                startIntroTimers();
                startPortraitPan();
            }, { once: true });

            myVideo.addEventListener('timeupdate', applyWaveVolume);
            setInterval(applyWaveVolume, 100);

            myVideo.play().catch(error => {
                console.error('Autoplay failed:', error);
            });

            playButton.addEventListener('click', () => {
                clearTimeout(fadeInDelay);
                requestDevicePanningPermission();
                setButtonOpacity(0);

                if (soundOn) {
                    soundOn = false;
                    myVideo.muted = true;
                    jumpVideo.muted = true;
                    fadeWaveVolume(0);
                    moveButtonToCorner();
                    return;
                }

                soundOn = true;
                myVideo.muted = false;
                fadeWaveVolume(1);

                if (jumpVideo.style.opacity === '1') {
                    jumpVideo.muted = false;
                    jumpVideo.volume = 0;
                    fadeVolume(jumpVideo, 1);
                }

                moveButtonToCorner();
            });

            jumpButton.addEventListener('click', () => {
                requestDevicePanningPermission();
                jumpStarted = true;
                soundOn = true;

                if (myVideo.currentTime >= getWaveLoopEnd()) {
                    myVideo.currentTime = 0;
                }

                myVideo.muted = false;
                fadeWaveVolume(1);

                jumpVideo.currentTime = 0;
                jumpVideo.muted = false;
                jumpVideo.volume = 0;
                setButtonOpacity(0);
                moveButtonToCorner();

                jumpButton.style.transform = 'scale(0.92)';

                setTimeout(() => {
                    jumpButton.style.transform = 'scale(1)';
                }, 150);

                jumpVideo.play().catch(error => {
                    console.error('Jump video failed:', error);
                });

                jumpVideo.style.opacity = '1';

                setTimeout(() => {
                    jumpButton.style.transition = 'transform 150ms ease, opacity 1s ease-in-out';
                    jumpButton.style.opacity = '0';
                }, 500);

                setTimeout(() => {
                    titleScreen.style.opacity = '0';
                }, 1000);

                clearTimeout(fadeInDelay);
                fadeInDelay = setTimeout(() => {
                    if (soundOn) {
                        fadeVolume(jumpVideo, 1);
                    }
                }, 1000);

                setTimeout(() => {
                    outroOverlay.style.display = 'none';
                }, 2000);
            });

            jumpVideo.addEventListener('ended', () => {
                playButton.style.display = 'none';
                hideMotionHint();

                outroOverlay.innerHTML = `
                    <div id="title-screen">THIS IS CHANCHO</div>
                    <div id="outro-text">
                        <p>Hes my main project, but if you would like to see more of my work <a href="#" id="projects-link">click here</a></p>
                        <p>If you want more Chancho, he has a <a href="https://www.tiktok.com/@chanchonovuela">TikTok</a></p>
                    </div>
                    <form>
                        <button id="hire-button" type="submit">HIRE ME</button>
                    </form>
                `;

                outroOverlay.style.opacity = '1';
                outroOverlay.style.display = 'flex';
            });
        });
    </script>

</body>

</html>
