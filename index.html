<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wander.ventures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Archivo Black', sans-serif;
        }

        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #myVideo,
        #jumpVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 2s ease-in-out;
        }

        #myVideo {
            z-index: 1;
            opacity: 1;
        }

        #jumpVideo {
            z-index: 2;
            opacity: 0;
        }

        #outro-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 11;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #fff;
            background: transparent;
            opacity: 1;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
        }

        #title-screen {
            color: #fff;
            font-weight: normal;
            font-size: 120px;
            line-height: 0.8;
            margin-bottom: 15px;
            max-width: 90%;
        }

        #title-screen div {
            opacity: 0;
            visibility: hidden;
        }

        #title-screen div:last-child {
            transform: translateX(-0.18em);
        }

        #button-slot {
            display: grid;
            place-items: center;
            min-height: 96px;
        }

        #button-slot > * {
            grid-area: 1 / 1;
        }

        #play-button {
            width: 96px;
            height: 96px;
            cursor: pointer;
            z-index: 12;
            background: transparent;
            border: 0;
            padding: 0;
            opacity: 1;
            transition: opacity 1s ease-in-out;
            pointer-events: auto;
        }

        #play-button.corner {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: 68px;
            height: 68px;
        }

        #play-button svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        #play-button .mute-slash {
            display: none;
        }

        #play-button.muted-icon .mute-slash {
            display: block;
        }

        #jump-button,
        #subscribe-button {
            cursor: pointer;
            padding: 15px 40px;
            background-color: skyblue;
            color: #fff;
            font-size: 2vw;
            font-weight: normal;
            border-radius: 50px;
            border: 0;
            white-space: nowrap;
            text-decoration: none;
            font-family: inherit;
            pointer-events: auto;
        }

        #jump-button {
            opacity: 0;
            visibility: hidden;
        }

        #outro-text {
            max-width: 700px;
            font-size: 20px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            #title-screen {
                font-size: 10vw;
            }

            #jump-button,
            #subscribe-button {
                font-size: 5vw;
            }
        }
    </style>
</head>

<body>

    <div id="video-container">
        <video id="myVideo" playsinline preload="auto" loop muted>
            <source src="chancho.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <video id="jumpVideo" playsinline preload="auto">
            <source src="jumpin.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div id="outro-overlay">
            <div id="title-screen">
                <div>WANDER</div>
                <div>VENTURES</div>
            </div>

            <div id="button-slot">
                <button id="play-button" aria-label="Turn sound on">
                    <svg viewBox="0 0 120 120" aria-hidden="true">
                        <mask id="volume-cutout">
                            <rect width="120" height="120" fill="white" />
                            <g transform="translate(10 10)">
                                <path d="M25 40h14l20-18v56L39 60H25z" fill="black" />
                                <path d="M67 36q12 14 0 28" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
                                <path d="M77 25q22 25 0 50" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
                            </g>
                        </mask>
                        <circle cx="60" cy="60" r="58" fill="#fff" mask="url(#volume-cutout)" />
                        <path class="mute-slash" d="M88 30L32 90" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" />
                    </svg>
                </button>

                <button id="jump-button">JUMP IN</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const myVideo = document.getElementById('myVideo');
            const jumpVideo = document.getElementById('jumpVideo');
            const playButton = document.getElementById('play-button');
            const outroOverlay = document.getElementById('outro-overlay');
            const jumpButton = document.getElementById('jump-button');
            const wanderTitle = document.querySelector('#title-screen div:first-child');
            const venturesTitle = document.querySelector('#title-screen div:last-child');

            let buttonIsCorner = false;
            let introStarted = false;
            let soundOn = false;
            let fadeInAudio;
            let fadeInDelay;

            jumpVideo.volume = 0;
            wanderTitle.style.transition = 'opacity 1s ease-in-out';
            venturesTitle.style.transition = 'opacity 1s ease-in-out';
            jumpButton.style.transition = 'none';

            outroOverlay.style.display = 'flex';

            function fadeVolume(video, targetVolume) {
                clearInterval(fadeInAudio);

                const startVolume = video.volume;
                let step = 0;

                fadeInAudio = setInterval(() => {
                    step++;
                    video.volume = startVolume + (targetVolume - startVolume) * (step / 20);

                    if (step >= 20) {
                        clearInterval(fadeInAudio);
                        video.volume = targetVolume;
                    }
                }, 50);
            }

            function moveButtonToCorner() {
                if (buttonIsCorner) {
                    playButton.style.display = 'block';
                    return;
                }

                playButton.style.opacity = '0';

                setTimeout(() => {
                    playButton.classList.add('corner');
                    buttonIsCorner = true;
                    playButton.style.display = 'block';
                    playButton.style.opacity = '0';

                    requestAnimationFrame(() => {
                        playButton.style.opacity = '1';
                    });
                }, 500);
            }

            function startIntroTimers() {
                if (introStarted) {
                    return;
                }

                introStarted = true;

                setTimeout(() => {
                    wanderTitle.style.visibility = 'visible';
                    wanderTitle.style.opacity = '1';
                }, 10000);

                setTimeout(() => {
                    venturesTitle.style.visibility = 'visible';
                    venturesTitle.style.opacity = '1';
                }, 14000);

                setTimeout(() => {
                    jumpButton.style.visibility = 'visible';
                    jumpButton.style.opacity = '1';

                    if (!buttonIsCorner) {
                        playButton.style.display = 'none';
                    }
                }, 22700);
            }

            document.addEventListener('mousemove', event => {
                if (buttonIsCorner || playButton.style.display === 'none') {
                    return;
                }

                const rect = playButton.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const distance = Math.hypot(event.clientX - centerX, event.clientY - centerY);
                const opacity = Math.max(0.15, Math.min(1, 1 - (distance - rect.width / 2) / 260));

                playButton.style.opacity = opacity;
            });

            myVideo.addEventListener('playing', startIntroTimers, { once: true });

            myVideo.play().catch(error => {
                console.error('Autoplay failed:', error);
            });

            playButton.addEventListener('click', () => {
                clearTimeout(fadeInDelay);

                if (soundOn) {
                    soundOn = false;
                    myVideo.muted = true;
                    jumpVideo.muted = true;
                    playButton.classList.remove('muted-icon');
                    return;
                }

                const activeVideo = jumpVideo.style.opacity === '1' ? jumpVideo : myVideo;

                soundOn = true;
                activeVideo.muted = false;
                activeVideo.volume = 0;
                playButton.classList.add('muted-icon');
                moveButtonToCorner();
                fadeVolume(activeVideo, 1);
            });

            jumpButton.addEventListener('click', () => {
                const firstVideoVolume = soundOn ? myVideo.volume : 0;

                soundOn = true;
                jumpVideo.currentTime = 0;
                jumpVideo.muted = false;
                jumpVideo.volume = 0;
                playButton.classList.add('muted-icon');
                moveButtonToCorner();

                jumpVideo.play();
                jumpVideo.style.opacity = '1';
                outroOverlay.style.opacity = '0';

                const fadeOutAudio = setInterval(() => {
                    myVideo.volume = Math.max(0, myVideo.volume - firstVideoVolume / 40);
                }, 50);

                clearTimeout(fadeInDelay);
                fadeInDelay = setTimeout(() => {
                    if (soundOn) {
                        fadeVolume(jumpVideo, 1);
                    }
                }, 1000);

                setTimeout(() => {
                    clearInterval(fadeOutAudio);
                    myVideo.volume = 0;
                    myVideo.pause();
                    myVideo.remove();
                    outroOverlay.style.display = 'none';
                }, 2000);
            });

            jumpVideo.addEventListener('ended', () => {
                outroOverlay.innerHTML = `
                    <div id="title-screen">TITLE</div>
                    <div id="outro-text">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                    </div>
                    <form>
                        <button id="subscribe-button" type="submit">SUBSCRIBE</button>
                    </form>
                `;

                outroOverlay.style.opacity = '1';
                outroOverlay.style.display = 'flex';
            });
        });
    </script>

</body>

</html>
