<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAXI WARS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Archivo Black', sans-serif;
        }

        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #myVideo,
        #jumpVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 2s ease-in-out;
        }

        #myVideo {
            z-index: 1;
            opacity: 1;
        }

        #jumpVideo {
            z-index: 2;
            opacity: 0;
        }

        #play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            cursor: pointer;
            z-index: 10;
            background: transparent;
            border: 0;
            padding: 0;
        }

        #play-button svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        #outro-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 11;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #fff;
            background: transparent;
        }

        #title-screen {
            color: #fff;
            font-weight: normal;
            font-size: 120px;
            line-height: 0.8;
            margin-bottom: 15px;
            max-width: 90%;
        }

        #title-screen div:last-child {
            transform: translateX(-0.18em);
        }

        #jump-button,
        #subscribe-button {
            cursor: pointer;
            padding: 15px 40px;
            background-color: skyblue;
            color: #fff;
            font-size: 2vw;
            font-weight: normal;
            border-radius: 50px;
            border: 0;
            white-space: nowrap;
            text-decoration: none;
            font-family: inherit;
        }

        #outro-text {
            max-width: 700px;
            font-size: 20px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            #title-screen {
                font-size: 10vw;
            }

            #jump-button,
            #subscribe-button {
                font-size: 5vw;
            }
        }
    </style>
</head>

<body>

    <div id="video-container">
        <video id="myVideo" playsinline preload="auto" loop>
            <source src="chancho.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <video id="jumpVideo" playsinline preload="auto">
            <source src="jump in.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <button id="play-button" aria-label="Play video">
            <svg viewBox="0 0 100 100" aria-hidden="true">
                <path fill="#fff" fill-rule="evenodd" d="M50 2a48 48 0 1 0 0 96a48 48 0 1 0 0-96zM40 30v40l34-20z" />
            </svg>
        </button>

        <div id="outro-overlay">
            <div id="title-screen">
                <div>WANDER</div>
                <div>VENTURES</div>
            </div>

            <button id="jump-button">JUMP IN</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const myVideo = document.getElementById('myVideo');
            const jumpVideo = document.getElementById('jumpVideo');
            const playButton = document.getElementById('play-button');
            const outroOverlay = document.getElementById('outro-overlay');
            const jumpButton = document.getElementById('jump-button');
            const wanderTitle = document.querySelector('#title-screen div:first-child');
            const venturesTitle = document.querySelector('#title-screen div:last-child');

            const fadeDuration = 2000;

            wanderTitle.style.opacity = '0';
            venturesTitle.style.opacity = '0';
            jumpButton.style.opacity = '0';
            jumpVideo.volume = 0;
            wanderTitle.style.transition = 'opacity 1s ease-in-out';
            venturesTitle.style.transition = 'opacity 1s ease-in-out';
            jumpButton.style.transition = 'none';
            outroOverlay.style.transition = `opacity ${fadeDuration}ms ease-in-out`;

            playButton.addEventListener('click', () => {
                myVideo.muted = false;
                jumpVideo.muted = false;

                myVideo.play().then(() => {
                    playButton.style.display = 'none';
                    outroOverlay.style.display = 'flex';
                    outroOverlay.style.opacity = '1';

                    setTimeout(() => {
                        wanderTitle.style.opacity = '1';
                    }, 8000);

                    setTimeout(() => {
                        venturesTitle.style.opacity = '1';
                    }, 14000);

                    setTimeout(() => {
                        jumpButton.style.opacity = '1';
                    }, 22500);
                }).catch(error => {
                    console.error('Video playback failed:', error);
                });
            });

            jumpButton.addEventListener('click', () => {
                const firstVideoVolume = myVideo.volume;

                jumpVideo.currentTime = 0;
                jumpVideo.volume = 0;
                jumpVideo.play();
                jumpVideo.style.opacity = '1';
                outroOverlay.style.opacity = '0';

                const fadeOutAudio = setInterval(() => {
                    myVideo.volume = Math.max(0, myVideo.volume - firstVideoVolume / 40);
                }, 50);

                setTimeout(() => {
                    const fadeInAudio = setInterval(() => {
                        jumpVideo.volume = Math.min(1, jumpVideo.volume + 0.05);

                        if (jumpVideo.volume >= 1) {
                            clearInterval(fadeInAudio);
                        }
                    }, 50);
                }, 1000);

                setTimeout(() => {
                    clearInterval(fadeOutAudio);
                    myVideo.volume = 0;
                    myVideo.pause();
                    myVideo.remove();
                    outroOverlay.style.display = 'none';
                }, fadeDuration);
            });

            jumpVideo.addEventListener('ended', () => {
                outroOverlay.innerHTML = `
                    <div id="title-screen">TITLE</div>
                    <div id="outro-text">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                    </div>
                    <form>
                        <button id="subscribe-button" type="submit">SUBSCRIBE</button>
                    </form>
                `;

                outroOverlay.style.opacity = '1';
                outroOverlay.style.display = 'flex';
            });
        });
    </script>

</body>

</html>
